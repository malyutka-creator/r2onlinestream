<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R2 Online Stream — Портал игроков</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0e1015;
      color: #f3f4f6;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #171a23;
      border: 1px solid #2b3040;
      border-radius: 14px;
      padding: 28px 22px;
    }
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 22px;
      border-radius: 10px;
      background: #9146ff;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }
    .muted {
      color: #9ca3af;
      font-size: 14px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>⚔️ R2 Online — Портал игроков</h2>
    <p id="status">Проверяем актуальную ссылку сервера...</p>
    <a id="goBtn" class="btn" href="#" style="display:none;">Открыть портал</a>
    <div id="urlText" class="muted"></div>
  </div>

  <script>
    fetch("link.txt?t=" + Date.now())
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(txt => {
        const url = txt.trim();
        if (!url.startsWith("https://")) throw new Error("empty");
        document.getElementById("status").textContent = "Сервер запущен, ссылка готова:";
        document.getElementById("urlText").textContent = url;
        const btn = document.getElementById("goBtn");
        btn.href = url;
        btn.style.display = "inline-block";
        // Если нужен мгновенный автопереход без нажатия кнопки — раскомментируй строку ниже:
        // window.location.href = url;
      })
      .catch(() => {
        document.getElementById("status").textContent =
          "Сервер или стрим сейчас офлайн. Загляни во время эфира!";
      });
  </script>
</body>
</html>
